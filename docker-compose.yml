# Local run (CMD, from the repo root):
#   docker compose up --build
# UI:  http://localhost:7860     API docs: http://localhost:8000/docs
#
# Weights: ./models (containing model.pt + model_card.json) is mounted. If it
# is empty, the container downloads them from MODEL_URL (the GitHub Release
# asset set as the image default) and verifies the SHA-256.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: chest-xray-classifier:latest
    container_name: chest-xray-classifier
    ports:
      - "7860:7860"   # Streamlit UI
      - "8000:8000"   # FastAPI (exposed locally for /docs)
    environment:
      TORCH_THREADS: 4
    volumes:
      - ./models:/home/user/app/models
    restart: unless-stopped
