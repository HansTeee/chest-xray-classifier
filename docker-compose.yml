# Local run (CMD, from the repo root):
#   docker compose up --build
# UI:  http://localhost:7860     API docs: http://localhost:8000/docs
#
# Weights: by default ./models (containing model.pt + model_card.json) is
# mounted. If it is empty, set HF_MODEL_REPO so the container downloads them:
#   set HF_MODEL_REPO=<user>/chest-xray-classifier-model && docker compose up

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: chest-xray-classifier:latest
    container_name: chest-xray-classifier
    ports:
      - "7860:7860"   # Streamlit UI
      - "8000:8000"   # FastAPI (exposed locally for /docs; not exposed on HF Spaces)
    environment:
      HF_MODEL_REPO: ${HF_MODEL_REPO:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/home/user/app/models
    restart: unless-stopped
